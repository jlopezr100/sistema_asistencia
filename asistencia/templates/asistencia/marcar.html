{% extends 'base.html' %}
{% load static %}

{% block title %}Marcado de Asistencia - UGEL Yungay{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/recuadro_huella.css' %}">
<style>
    /* Estilos específicos para la cabecera del Quiosco Seguro */
    .header-quiosco {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #1F4E78;
        padding-bottom: 12px;
        margin-bottom: 25px;
    }
    .header-quiosco h2 {
        margin: 0;
        color: #1F4E78;
        font-size: 1.6rem;
        font-weight: bold;
    }
    .btn-salir-quiosco {
        background-color: #E74C3C;
        color: #FFFFFF !important;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
        font-size: 0.9rem;
        transition: background 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }
    .btn-salir-quiosco:hover {
        background-color: #C0392B;
        box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
    }
</style>
{% endblock %}

{% block content %}
<div class="mantenimiento-container" style="max-width: 550px; margin: 30px auto;">
    
    <!-- CABECERA MODIFICADA: Título a la izquierda y Botón Salir a la derecha -->
    <div class="header-quiosco">
        <h2><i class="fas fa-fingerprint"></i> Control de Asistencia Digital</h2>
        <a href="{% url 'inicio' %}" class="btn-salir-quiosco">
            <i class="fas fa-sign-out-alt"></i> Salir
        </a>
    </div>

    <!-- La cámara web trabaja de forma invisible de fondo -->
    <div class="camera-container" style="display: none;">
        <video id="video" autoplay muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <!-- Zona del escáner láser táctil -->
    <div id="contenedor-huella" class="box-huella" onclick="procesarMarcadoBiometrico()" style="cursor: pointer;">
        <div class="sensor-container">
            <div class="huella-digital-css">
                <div class="linea-escaner"></div>
            </div>
        </div>

        <p id="estado-lectura" class="st-pendiente text-uppercase" style="font-weight: bold; color: #1F4E78; letter-spacing: 0.5px;">
            TOQUE EL ESCÁNER PARA COLOCAR EL DEDO
        </p>
        
        <form id="form-asistencia" onsubmit="return false;">
            <input type="hidden" id="latitud" name="latitud">
            <input type="hidden" id="longitud" name="longitud">
            <input type="hidden" id="huella" name="huella">
        </form>
    </div>

    <!-- Contenedor para banners de respuestas inmediatas del servidor -->
    <div id="mensaje-sistema" class="alert d-none text-center font-weight-bold" style="margin-top: 25px; font-size: 1.1rem; padding: 15px; border-radius: 10px;"></div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/main.js' %}"></script>
{% endblock %}

{% extends 'base.html' %}
{% load static %}

{% block title %}Marcado de Asistencia - UGEL Yungay{% endblock %}

{% block extra_css %}
<!-- Inyección de tus estilos unificados en el head de base.html -->
<link rel="stylesheet" href="{% static 'css/recuadro_huella.css' %}">
<link rel="stylesheet" href="https://cloudflare.com">
{% endblock %}

{% block content %}
<div class="mantenimiento-container" style="max-width: 500px; margin: 30px auto;">
    <div class="section-header">
        <h2><i class="fas fa-fingerprint"></i> Control de Asistencia Digital</h2>
    </div>

    <!-- Transmisión de la cámara web -->
    <div class="camera-container mb-4">
        <video id="video" autoplay muted></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <!-- Zona de la huella adaptada a tus clases nativas -->
    <div id="contenedor-huella" class="box-huella">
        <!-- Icono interactivo que simula el sensor del quiosco -->
        <div class="icon-biometric">
            <i class="fas fa-fingerprint fa-5x"></i>
        </div>

        <p id="estado-lectura" class="st-pendiente text-uppercase">
            <i class="fas fa-arrow-down animate-bounce"></i> Coloque el dedo en el lector
        </p>

        <form id="form-asistencia">
            <input type="hidden" id="latitud" name="latitud">
            <input type="hidden" id="longitud" name="longitud">

            <div style="margin-bottom: 20px;">
                <input type="text" id="huella" name="huella" class="form-input-biometric" placeholder="••••••••"
                    autocomplete="off" required>
            </div>

            <button type="button" id="btn-marcar" class="btn-apoyar-dedo">
                <i class="fas fa-check-circle"></i> Confirmar Identidad
            </button>
        </form>
    </div>

    <!-- Notificaciones del sistema embebidas -->
    <div id="mensaje-sistema" class="alert d-none shadow-sm text-center" style="margin-top: 15px;"></div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Script de control posicionado al final del cuerpo -->
<script src="{% static 'js/main.js' %}"></script>
{% endblock %}
